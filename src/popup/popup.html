<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fab Mask</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="../icons/icon32.png" width="24" height="24" alt="">
    <div class="header-text">
      <h1 data-i18n="extName"></h1>
      <p id="page-status" class="muted"></p>
    </div>
    <label class="switch" data-i18n-title="popupMasking">
      <input id="enabled" type="checkbox" role="switch" data-i18n-aria-label="popupMasking">
      <span class="track"></span>
    </label>
  </header>

  <main id="body">
    <section class="always toolbar">
      <div class="quick">
        <button id="curtain" class="btn toggle" type="button" aria-pressed="false" data-i18n-title="curtainButtonHint">
          <span aria-hidden="true">❚❚</span><span data-i18n="curtainButton"></span>
        </button>
        <button id="preview" class="btn toggle" type="button" aria-pressed="false" data-i18n-title="previewButtonHint">
          <span aria-hidden="true">✓</span><span data-i18n="previewButton"></span>
        </button>
        <button id="present" class="btn toggle" type="button" aria-pressed="false" data-i18n-title="presentButtonHint">
          <span aria-hidden="true">⛶</span><span data-i18n="presentButton"></span>
        </button>
      </div>
      <label class="row profile-row" for="profile">
        <span class="label" data-i18n="sectionProfile"></span>
        <select id="profile"></select>
      </label>
    </section>

    <div class="columns">
      <div class="col">
        <section>
          <h2 id="detect-heading" data-i18n="sectionDetect"></h2>
          <div class="categories" role="group" aria-labelledby="detect-heading">
            <label class="check"><input type="checkbox" data-category="guid"><span><b data-i18n="catGuid"></b><small data-i18n="catGuidHint"></small></span></label>
            <label class="check"><input type="checkbox" data-category="email"><span><b data-i18n="catEmail"></b><small data-i18n="catEmailHint"></small></span></label>
            <label class="check"><input type="checkbox" data-category="endpoint"><span><b data-i18n="catEndpoint"></b><small data-i18n="catEndpointHint"></small></span></label>
            <label class="check"><input type="checkbox" data-category="secret"><span><b data-i18n="catSecret"></b><small data-i18n="catSecretHint"></small></span></label>
            <label class="check"><input type="checkbox" data-category="userProfile"><span><b data-i18n="catUserProfile"></b><small data-i18n="catUserProfileHint"></small></span></label>
            <label class="check"><input type="checkbox" data-category="learnedNames"><span><b data-i18n="catLearnedNames"></b><small data-i18n="catLearnedNamesHint"></small></span></label>
            <label class="check"><input type="checkbox" data-category="workspaceNames"><span><b data-i18n="catWorkspaceNames"></b><small data-i18n="catWorkspaceNamesHint"></small></span></label>
            <label class="check"><input type="checkbox" data-category="ipAddress"><span><b data-i18n="catIpAddress"></b><small data-i18n="catIpAddressHint"></small></span></label>
          </div>
        </section>
      </div>
      <div class="col">
        <section>
          <h2 data-i18n="sectionAppearance"></h2>
          <div class="segmented" role="radiogroup" data-i18n-aria-label="sectionAppearance">
            <label><input type="radio" name="mode" value="pixelate"><span data-i18n="modePixelate"></span></label>
            <label><input type="radio" name="mode" value="blur"><span data-i18n="modeBlur"></span></label>
            <label><input type="radio" name="mode" value="fake"><span data-i18n="modeFake"></span></label>
            <label><input type="radio" name="mode" value="redact"><span data-i18n="modeRedact"></span></label>
          </div>
          <label id="blur-row" class="row">
            <span data-i18n="blurStrength"></span>
            <input id="blurPx" type="range" min="2" max="20" step="1">
            <output id="blurPx-value"></output>
          </label>
          <label class="row toggle-row"><span data-i18n="stripTooltips"></span><span class="switch"><input id="stripTooltips" type="checkbox" role="switch"><span class="track"></span></span></label>
          <label class="row toggle-row"><span data-i18n="maskTitle"></span><span class="switch"><input id="maskTitle" type="checkbox" role="switch"><span class="track"></span></span></label>
          <label class="row toggle-row"><span data-i18n="revealOnHover"></span><span class="switch"><input id="revealOnHover" type="checkbox" role="switch"><span class="track"></span></span></label>
        </section>
        <section class="actions">
          <button id="pick" class="btn primary" type="button" data-i18n-title="pickElementHint">
            <span data-i18n="pickElement"></span>
          </button>
          <p class="muted" data-i18n="pickElementHint"></p>
        </section>
      </div>
    </div>
  </main>

  <footer class="footer">
    <a href="#" id="open-options" data-i18n="moreSettings"></a>
    <a href="#" id="feedback" data-i18n="sendFeedback" data-i18n-title="sendFeedbackHint"></a>
  </footer>

  <script src="../shared/settings.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/feedback.js"></script>
  <script src="popup.js"></script>
</body>
</html>
