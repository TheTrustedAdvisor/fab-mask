<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fab Mask</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header class="header">
      <img src="../icons/icon48.png" width="40" height="40" alt="">
      <h1 data-i18n="optionsTitle"></h1>
    </header>

    <form id="form">
      <section class="card">
        <h2><label for="customTerms" data-i18n="customTerms"></label></h2>
        <p class="muted" data-i18n="customTermsHint"></p>
        <textarea id="customTerms" rows="8" spellcheck="false" placeholder="Contoso&#10;Jane Doe&#10;Finance-Prod"></textarea>
      </section>

      <section class="card">
        <h2><label for="customSelectors" data-i18n="customSelectors"></label></h2>
        <p class="muted" data-i18n="customSelectorsHint"></p>
        <textarea id="customSelectors" rows="8" spellcheck="false" class="mono" placeholder=".workspace-name&#10;[data-testid=&quot;owner-cell&quot;]"></textarea>
        <p id="selector-errors" class="error" role="alert" hidden></p>
      </section>

      <div class="buttons">
        <button type="submit" class="btn primary" data-i18n="save"></button>
        <span id="status" class="muted" role="status"></span>
        <span class="spacer"></span>
        <button type="button" id="reset" class="btn" data-i18n="resetDefaults"></button>
      </div>
    </form>

    <section class="card">
      <h2 data-i18n="sectionProfiles"></h2>
      <p class="muted" data-i18n="profilesHint"></p>
      <form id="profile-form" class="inline-form">
        <input id="profile-name" type="text" maxlength="60" required data-i18n-placeholder="profileNamePlaceholder" data-i18n-aria-label="sectionProfiles">
        <button type="submit" class="btn" data-i18n="saveProfile"></button>
      </form>
      <ul id="profile-list" class="item-list"></ul>
      <p id="no-profiles" class="muted" data-i18n="noProfiles"></p>
    </section>

    <section class="card">
      <h2 data-i18n="sectionPresentation"></h2>
      <p class="muted" data-i18n="presentationHint"></p>
      <label class="inline-form" for="presentation-profile">
        <span class="field-label" data-i18n="presentationProfileLabel"></span>
        <select id="presentation-profile"></select>
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="learnedNamesTitle"></h2>
      <p class="muted" data-i18n="learnedNamesHint"></p>
      <ul id="learned-list" class="chips"></ul>
      <p id="no-learned" class="muted" data-i18n="learnedNamesEmpty"></p>
      <button type="button" id="clear-learned" class="btn" data-i18n="clearLearned"></button>
    </section>

    <p class="feedback-row">
      <a href="#" id="feedback" data-i18n="sendFeedback" data-i18n-title="sendFeedbackHint"></a>
    </p>

    <section class="card about" id="about">
      <h2 data-i18n="aboutTitle"></h2>
      <p><strong>Matthias Falland</strong> · <span class="muted" data-i18n="aboutText"></span></p>
      <ul class="about-links">
        <li><a href="https://www.fabricperiodictable.com" target="_blank" rel="noopener noreferrer">fabricperiodictable.com</a></li>
        <li><a href="https://www.linkedin.com/in/matthias-falland" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        <li><a href="https://github.com/TheTrustedAdvisor" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="https://www.youtube.com/@TheTrustedAdvisor" target="_blank" rel="noopener noreferrer">YouTube</a></li>
      </ul>
    </section>

    <section class="card note">
      <h2 data-i18n="limitationsTitle"></h2>
      <p class="muted" data-i18n="limitationsText"></p>
    </section>
  </main>

  <script src="../shared/settings.js"></script>
  <script src="../shared/styles.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/feedback.js"></script>
  <script src="options.js"></script>
</body>
</html>
